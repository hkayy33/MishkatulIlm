<div class="auth-gate">
  <h2 class="auth-gate__title">Sign in required</h2>
  <p class="auth-gate__text">
    Log in or create an account to continue to student onboarding.
  </p>
  <div class="auth-gate__actions">
    <a routerLink="/login" class="auth-gate__btn auth-gate__btn--primary">Log in</a>
    <a routerLink="/register" class="auth-gate__btn auth-gate__btn--outline">Register</a>
  </div>
</div>
