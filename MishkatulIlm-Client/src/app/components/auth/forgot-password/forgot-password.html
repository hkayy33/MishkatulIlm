<div class="auth-page">
  <div class="auth-card">
    <header class="auth-card__header">
      <h2>Forgot password</h2>
      <p class="auth-card__lede">
        Enter your account email and we will send you a link to choose a new password.
      </p>
    </header>

    @if (submitInfo) {
      <p class="auth-form__info" role="status">{{ submitInfo }}</p>
    }
    @if (submitError) {
      <p class="auth-form__error" role="alert">{{ submitError }}</p>
    }

    <form class="auth-form" novalidate (submit)="onSubmit($event)" autocomplete="on">
      <div class="form-field">
        <label for="forgot-email">Email</label>
        <input
          id="forgot-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          [disabled]="emailSent"
          placeholder="you@example.com"
        />
      </div>

      <button type="submit" class="auth-form__submit" [disabled]="submitBusy || emailSent">
        @if (submitBusy) {
          Sending…
        } @else if (emailSent) {
          Email sent
        } @else {
          Send reset link
        }
      </button>
    </form>

    <p class="auth-card__switch">
      Remember your password?
      <a routerLink="/login">Back to log in</a>
    </p>
  </div>
</div>
