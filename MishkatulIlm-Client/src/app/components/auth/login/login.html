<div class="auth-page">
  <div class="auth-card">
    <header class="auth-card__header">
      <h2>Log in</h2>
      <p class="auth-card__lede">Welcome back. Sign in to continue your learning journey.</p>
    </header>

    <form class="auth-form" novalidate (submit)="onSubmit($event)" autocomplete="on">
      @if (submitInfo(); as info) {
        <p class="auth-form__info" role="status">{{ info }}</p>
      }
      @if (submitError(); as err) {
        <p class="auth-form__error" role="alert">{{ err }}</p>
      }

      <div class="form-field">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        />
      </div>

      <div class="form-field">
        <div class="form-field__label-row">
          <label for="login-password">Password</label>
          <a class="auth-form__link" routerLink="/forgot-password">Forgot password?</a>
        </div>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          minlength="8"
          placeholder="••••••••"
        />
      </div>

      <div class="form-field form-field--checkbox">
        <input id="login-remember" name="remember" type="checkbox" />
        <label for="login-remember">Keep me signed in on this device</label>
      </div>

      <button type="submit" class="auth-form__submit" [disabled]="submitBusy()">
        @if (submitBusy()) {
          Signing in…
        } @else {
          Log in
        }
      </button>
    </form>

    <p class="auth-card__switch">
      New here?
      <a routerLink="/register">Create an account</a>
    </p>
  </div>
</div>
