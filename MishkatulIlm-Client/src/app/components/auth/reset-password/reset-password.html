<div class="auth-page">
  <div class="auth-card">
    <header class="auth-card__header">
      <h2>Choose a new password</h2>
      <p class="auth-card__lede">
        Your reset link worked. Enter a new password below, then continue to your account.
      </p>
    </header>

    @if (submitError) {
      <p class="auth-form__error" role="alert">{{ submitError }}</p>
    }

    <form class="auth-form" novalidate (submit)="onSubmit($event)" autocomplete="on">
      <div class="form-field password-field">
        <label for="reset-password">New password</label>
        <div class="password-field__input-wrap">
          <input
            id="reset-password"
            name="newPassword"
            [type]="showNewPassword() ? 'text' : 'password'"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="At least 8 characters"
          />
          <button
            type="button"
            class="password-field__toggle"
            [attr.aria-label]="showNewPassword() ? 'Hide new password' : 'Show new password'"
            [attr.aria-pressed]="showNewPassword()"
            (click)="showNewPassword.set(!showNewPassword())"
          >
            @if (showNewPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="form-field password-field">
        <label for="reset-confirm">Confirm password</label>
        <div class="password-field__input-wrap">
          <input
            id="reset-confirm"
            name="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="Repeat password"
          />
          <button
            type="button"
            class="password-field__toggle"
            [attr.aria-label]="showConfirmPassword() ? 'Hide confirm password' : 'Show confirm password'"
            [attr.aria-pressed]="showConfirmPassword()"
            (click)="showConfirmPassword.set(!showConfirmPassword())"
          >
            @if (showConfirmPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="auth-form__submit" [disabled]="submitBusy">
        @if (submitBusy) {
          Saving…
        } @else {
          Save new password
        }
      </button>
    </form>

    <p class="auth-card__switch">
      Need a new link?
      <a routerLink="/forgot-password">Request another reset email</a>
    </p>
  </div>
</div>
