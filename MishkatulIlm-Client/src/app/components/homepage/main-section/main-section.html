<div class="hero">
  <video
    class="hero-bg-video"
    autoplay
    muted
    loop
    playsinline
    preload="metadata"
    aria-hidden="true"
  >
    <source src="/hero-background.mp4" type="video/mp4" />
  </video>
  <div class="hero-overlay" aria-hidden="true"></div>

  <div class="hero-layout">
    <div class="info-section">
      <h2 class="hero-title">
        <span class="hero-title-line">Learn Arabic &amp; Quran</span>
        <span class="hero-title-line gold-highlight">with Confidence</span>
      </h2>
      <p class="hero-subtitle">
        Personalized 1-on-1 lessons tailored to your goals and your pace.
      </p>
      <div class="action-buttons">
        <app-get-started-btn label="Get Started" variant="primary"></app-get-started-btn>
        <app-get-started-btn label="Learn More" variant="outline" route="/about"></app-get-started-btn>
      </div>
    </div>
  </div>
</div>
