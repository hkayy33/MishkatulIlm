<a
  class="card"
  [routerLink]="['/courses', card.slug]"
  [attr.aria-label]="'Read more about ' + card.title"
>
  <div class="card-hero">
    <img
      class="card-hero__image"
      [src]="card.image"
      [alt]="card.title"
      loading="lazy"
      decoding="async"
    />
    <div class="card-hero__overlay" aria-hidden="true">
      <p class="card-hero__arabic" dir="rtl" lang="ar">{{ card.titleArabic }}</p>
      <span class="card-hero__divider"></span>
      <p class="card-hero__english">{{ card.overlayTitle ?? card.title }}</p>
    </div>
  </div>

  <div class="card-body">
    <h3 class="card-title">
      {{ card.title }}
      <span class="card-title__arabic" dir="rtl" lang="ar">({{ card.titleArabic }})</span>
    </h3>
    <p class="card-summary">{{ card.summary }}</p>
    <span class="card-cta">Read More</span>
  </div>
</a>
