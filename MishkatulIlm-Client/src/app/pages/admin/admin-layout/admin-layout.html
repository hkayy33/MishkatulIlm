<div class="admin-shell">
  <aside class="admin-side" aria-label="Admin navigation">
    <div class="admin-brand">Admin</div>
    <nav class="admin-nav">
      <a routerLink="pending" routerLinkActive="is-active">Pending applications</a>
      <a routerLink="students" routerLinkActive="is-active">Active students</a>
      <a routerLink="calendar" routerLinkActive="is-active">Calendar</a>
      <a routerLink="details" routerLinkActive="is-active">Admin details</a>
    </nav>
    <div class="admin-side-footer">
      <a class="admin-link-quiet" routerLink="/">Back to site</a>
      <button type="button" class="admin-signout" (click)="signOut()">Sign out</button>
    </div>
  </aside>
  <section class="admin-content">
    <router-outlet />
  </section>
</div>
