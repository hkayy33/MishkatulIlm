<div
    class="nav-shell"
    [class.nav-shell--menu-open]="mobileMenuOpen()"
    [class.nav-shell--home]="isHomeRoute()"
>
    <div class="container" [class.container--home]="isHomeRoute()">
        <a routerLink="/" class="nav-logo" (click)="closeMobileMenu()">
            <img
                class="nav-logo__img"
                src="/logo.png"
                srcset="/logo.png 1x, /logo@2x.png 2x"
                width="651"
                height="185"
                alt="Al Usooliyyah Academy logo"
                decoding="async"
            >
        </a>

        <button
            type="button"
            class="nav-toggle"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="mobileMenuOpen()"
            aria-controls="nav-menu"
            [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        >
            <span class="nav-toggle-icon" aria-hidden="true">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </span>
        </button>

        <nav
            id="nav-menu"
            class="nav-menu"
            [class.nav-menu--open]="mobileMenuOpen()"
            aria-label="Main navigation"
        >
            <ul class="nav-links">
                <li class="nav-link">
                    <a
                        routerLink="/"
                        class="nav-route-link"
                        [attr.aria-current]="isHomeRoute() ? 'page' : null"
                        (click)="closeMobileMenu()"
                    >
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-link">
                    <a
                        routerLink="/about"
                        class="nav-route-link"
                        [attr.aria-current]="isAboutRoute() ? 'page' : null"
                        (click)="closeMobileMenu()"
                    >
                        <span>About Us</span>
                    </a>
                </li>
                <li
                    class="nav-link"
                    tabindex="0"
                    (click)="onProgramsClick()"
                    (keydown)="onProgramsKeydown($event)"
                    role="button"
                    aria-label="Programs — scroll to What We Offer"
                >
                    <p><span>Programs</span></p>
                </li>
                <li class="nav-link">
                    <a
                        routerLink="/pricing"
                        class="nav-route-link"
                        [attr.aria-current]="isPricingRoute() ? 'page' : null"
                        (click)="closeMobileMenu()"
                    >
                        <span>Pricing</span>
                    </a>
                </li>
                @if (auth.isAuthenticated()) {
                    <li class="nav-link nav-link--user">
                        <div #userMenu class="nav-user-menu">
                            <button
                                type="button"
                                class="nav-user"
                                [attr.aria-expanded]="menuOpen()"
                                aria-haspopup="menu"
                                [attr.aria-controls]="menuOpen() ? 'nav-user-dropdown' : null"
                                (click)="toggleUserMenu($event)"
                                (keydown)="onUserMenuKeydown($event)"
                            >
                                <svg
                                    class="nav-user__icon"
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true"
                                >
                                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.75" />
                                    <path
                                        d="M5 20c0-3.314 3.134-6 7-6s7 2.686 7 6"
                                        stroke="currentColor"
                                        stroke-width="1.75"
                                        stroke-linecap="round"
                                    />
                                </svg>
                                <span class="nav-user__name">{{ userFirstName() }}</span>
                                <svg
                                    class="nav-user__chevron"
                                    width="12"
                                    height="12"
                                    viewBox="0 0 12 12"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true"
                                    [class.nav-user__chevron--open]="menuOpen()"
                                >
                                    <path
                                        d="M2.5 4.5 6 8l3.5-3.5"
                                        stroke="currentColor"
                                        stroke-width="1.4"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />
                                </svg>
                            </button>
                            @if (menuOpen()) {
                                <ul id="nav-user-dropdown" class="nav-user-dropdown" role="menu">
                                    <li role="none">
                                        <a
                                            class="nav-user-dropdown__item"
                                            role="menuitem"
                                            [routerLink]="dashboardLink()"
                                            (click)="closeMenus()"
                                        >
                                            My dashboard
                                        </a>
                                    </li>
                                    <li role="none">
                                        <button
                                            type="button"
                                            class="nav-user-dropdown__item nav-user-dropdown__item--button"
                                            role="menuitem"
                                            (click)="onLogout()"
                                        >
                                            Log out
                                        </button>
                                    </li>
                                </ul>
                            }
                        </div>
                    </li>
                } @else {
                    <li class="nav-link">
                        <a routerLink="/login" class="nav-route-link" (click)="closeMobileMenu()">
                            <span>Log in</span>
                        </a>
                    </li>
                    <li class="nav-link nav-link--cta">
                        <app-get-started-btn (click)="closeMobileMenu()"></app-get-started-btn>
                    </li>
                }
            </ul>
        </nav>
    </div>

    @if (mobileMenuOpen()) {
        <button
            type="button"
            class="nav-backdrop"
            (click)="closeMobileMenu()"
            aria-label="Close navigation menu"
            tabindex="-1"
        ></button>
    }
</div>
